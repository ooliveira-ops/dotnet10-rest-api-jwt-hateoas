services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "SENHA_REMOVIDA"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - erudio-network
    restart: unless-stopped

  rest-with-asp-net-10-erudio:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: ooliveir4/rest-with-asp-net-10-erudio:latest
    container_name: rest-api-app
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__MySQLServerSqlConnectionStrings=Data Source=sqlserver,1433;Initial Catalog=asp_net_10_erudio;User ID=sa;Password=SENHA_REMOVIDA;Encrypt=false;TrustServerCertificate=True;
    depends_on:
      - sqlserver
    ports:
      - "8080:8080"
    networks:
      - erudio-network
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - erudio-network

networks:
  erudio-network:
    driver: bridge

volumes:
  sqlserver_data:
  portainer_data:  