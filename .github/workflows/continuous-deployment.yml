name: Continuous Integration, Delivery and Deployment with Github Actions and .NET 10

on:
  push:
    branches: [ "main", "dev" ]

    
jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependecies
      run: dotnet restore RestWithASPNET10Erudio.csproj
      working-directory: RestWithASPNET10Erudio/RestWithASPNET10Erudio

    - name: Build ASP.NET 10 App
      run: dotnet build RestWithASPNET10Erudio.csproj --configuration Release --no-restore
      working-directory: RestWithASPNET10Erudio/RestWithASPNET10Erudio

    - name: Test ASP.NET 10 App
      run: |
        dotnet build RestWithASPNET10Erudio.Tests.csproj --configuration Release
        dotnet test RestWithASPNET10Erudio.Tests.csproj --configuration Release --no-build --logger "console;verbosity=detailed"
      working-directory: UnitTestsInAPS_NET/RestWithASPNET10Erudio.Tests

    - name: Docker Compose Build
      run: |
        docker compose build
        docker images
      working-directory: RestWithASPNET10Erudio/RestWithASPNET10Erudio
      
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_ACCESS_TOKEN }}

    - name: Login to Google Cloud Platform
      uses: 'google-github-actions/auth@v3'
      with:
        project_id: 'project-4f6c2526-7e00-40c2-aad'
        workload_identity_provider: '${{ secrets.WIF_PROVIDER }}'
        service_account: '${{ secrets.WIF_SERVICE_ACCOUNT }}'

    - name: Configure Docker Authentication for Google Cloud Artifact Registry
      run: gcloud auth configure-docker us-central1-docker.pkg.dev

    - name: Push to Google Cloud Artifact Registry
      run: |
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-asp-net-10-erudio:latest ${{ secrets.REGISTRY_INFO }}/oliveira-registry/rest-with-asp-net-10-eru:latest
        docker tag ${{ secrets.DOCKER_USERNAME }}/rest-with-asp-net-10-erudio:latest ${{ secrets.REGISTRY_INFO }}/oliveira-registry/rest-with-asp-net-10-eru:${{ github.run_id }}
        docker push ${{ secrets.REGISTRY_INFO }}/oliveira-registry/rest-with-asp-net-10-eru:latest
        docker push ${{ secrets.REGISTRY_INFO }}/oliveira-registry/rest-with-asp-net-10-eru:${{ github.run_id }}
        
    - name: Push to Docker Hub to Container Registry
      run: |
        docker push ooliveir4/rest-with-asp-net-10-erudio:latest
        docker tag ooliveir4/rest-with-asp-net-10-erudio:latest ooliveir4/rest-with-asp-net-10-erudio:${{ github.run_id }}
        docker push ooliveir4/rest-with-asp-net-10-erudio:${{ github.run_id }}
        
